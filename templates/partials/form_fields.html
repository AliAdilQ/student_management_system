{% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
<div class="row g-4">{% for field in form %}<div class="{% if field.name == 'address' or field.name == 'description' or field.name == 'remarks' or field.name == 'subjects' %}col-12{% else %}col-md-6{% endif %}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="field-error"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>{% endfor %}</div>{% endfor %}</div>
